name: Publish

# Publishes to npm when a version tag is pushed. npm trusts this workflow
# (trusted publishing), so no npm token is stored in the repository.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - name: The tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm publish --access public

  # Standalone binaries for `curl -fsSL https://frontmost.ai/install | bash`.
  # install.sh downloads frontmost-<os>-<arch>.tar.gz from the latest release and checks it against SHA256SUMS.
  binaries:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: The tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Build
        run: scripts/build-binaries.sh dist
      - name: Test the macOS binary as a real program
        run: FRONTMOST_BIN="$PWD/dist/darwin-arm64/frontmost" node --test test/process.test.js
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS install.sh --clobber

  # Runs the real installer against the new release on each supported system.
  install:
    needs: binaries
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: FRONTMOST_VERSION="${GITHUB_REF_NAME#v}" bash install.sh
      - run: test "$("$HOME/.frontmost/bin/frontmost" --version)" = "${GITHUB_REF_NAME#v}"
      - run: FRONTMOST_BIN="$HOME/.frontmost/bin/frontmost" node --test test/process.test.js
